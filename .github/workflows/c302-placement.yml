name: c302 placement

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install numpy pytest torch
      - run: python -m c302_placement run
      - run: pytest -q tests/test_c302_placement.py
      - run: python -m c302_placement dynamics --experiment-id C302-NAMED-NEURON-DYNAMICS-1 --output /tmp/c302-dynamics.json
      - run: python -m c302_placement dynamics --experiment-id C302-EXCLUSIVE-MOTOR-DYNAMICS-1 --output /tmp/c302-exclusive-motor.json
      - run: python -m c302_placement dynamics --experiment-id C302-SIGNED-SYNAPSE-DYNAMICS-1 --output /tmp/c302-signed-synapse.json
      - run: python -m c302_placement biophysics --output /tmp/c302-neuromuscular-body.json
      - run: python -m c302_placement biophysics --experiment-id C302-GRADED-RELEASE-FEEDBACK-LADDER-1 --output /tmp/c302-graded-release-feedback-ladder.json
